
name: PaySuite .NET SDK CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore PaySuite.Sdk.slnx

      - name: Build solution
        run: dotnet build PaySuite.Sdk.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PaySuite.Sdk.slnx --configuration Release --no-build --no-restore
